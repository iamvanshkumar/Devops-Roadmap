<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevOps 60-Day Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f7;--surface:#fff;--ink:#14202b;--mute:#5b6b78;--line:#d8e0e6;--acc:#0f766e;--accbg:#d9f0ed;--warn:#b45309;--code:#e8eef2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181f;--surface:#18232c;--ink:#e6edf2;--mute:#93a4b1;--line:#2b3a46;--acc:#4fd1c0;--accbg:#1c3a3a;--warn:#f0a85a;--code:#223340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181f;--surface:#18232c;--ink:#e6edf2;--mute:#93a4b1;--line:#2b3a46;--acc:#4fd1c0;--accbg:#1c3a3a;--warn:#f0a85a;--code:#223340;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pct{font-size:2.6rem;font-weight:700;color:var(--acc);line-height:1}
.bar,.mini{background:var(--code);border-radius:6px;overflow:hidden}
.bar{height:12px;margin:10px 0}
.mini{height:5px;width:90px;border-radius:3px}
.bar>i,.mini>i{display:block;height:100%;background:var(--acc);transition:width .25s}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:.95rem}
.stats b{color:var(--ink)}
.row2{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px}
label{font-size:.9rem;color:var(--mute)}
input[type=date]{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
#pace{font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
summary{cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8";color:var(--mute);transition:transform .15s;flex:none}
details[open]>summary::before{transform:rotate(90deg)}
.ph>summary{font-weight:700;font-size:1.08rem;background:var(--accbg);border-radius:10px}
.ph[open]>summary{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.ttl{flex:1;min-width:0}
.cnt{color:var(--mute);font-size:.9rem;white-space:nowrap;font-weight:400}
.ph>.in{padding:8px 8px 0}
.day{margin-bottom:8px}
.day>summary{padding:8px 12px}
.dn{font-weight:700;white-space:nowrap}
.day.full>summary .ttl{color:var(--mute);text-decoration:line-through}
.day.full>summary .dn{color:var(--acc)}
.body{padding:2px 14px 12px 34px}
.body h4{margin:8px 0 4px;font-size:.9rem;color:var(--mute);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li label{display:flex;gap:10px;align-items:flex-start;padding:3px 0;font-size:1rem;color:var(--ink);cursor:pointer}
li input:checked+span{color:var(--mute);text-decoration:line-through}
input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--acc);cursor:pointer;flex:none}
code{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;background:var(--code);border-radius:4px;font:500 .82rem "JetBrains Mono",ui-monospace,monospace}
.mk{margin-top:8px;font-size:.88rem;padding:4px 10px}
.note{color:var(--mute);font-size:.85rem;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>DevOps in 60 days: tracker</h1>
<p class="sub">Open a phase, then a day. Tick each subtopic as you finish it. Progress saves in this browser.</p>
<div class="panel">
  <div class="big"><span class="pct" id="pct">0%</span><span id="cnt"></span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="pb"><i id="fill"></i></div>
  <div class="stats"><span>Days complete: <b id="dd"></b></span><span>Streak: <b id="streak"></b></span><span>Next up: <b id="next"></b></span></div>
  <div class="row2"><label for="start">Start date (Day 1)</label><input type="date" id="start"><span id="pace"></span></div>
</div>
<div class="tools"><button id="exp">Expand all</button><button id="col">Collapse all</button><button id="reset">Reset all</button></div>
<div id="tree"></div>
<p class="note">Commands are starting points for each lab. Use man pages and official docs to go deeper.</p>
</div>
<script>
var PH=[["Fundamentals",1,7],["Linux and shell",8,14],["Networking and Git",15,21],["Docker and CI/CD",22,28],["AWS cloud",29,35],["Terraform and Ansible",36,42],["Kubernetes",43,52],["Observability and SRE",53,57],["Capstone and interviews",58,60]];
var D=[
"Computer architecture^What is a computer; Hardware vs software; CPU: cores, threads, clock speed; RAM vs storage; HDD vs SSD; Motherboard, GPU, peripherals; How a program runs^lscpu; free -h; lsblk; df -h",
"Operating systems^What is an OS; Kernel vs shell; User space vs kernel space; System calls; Device drivers; Boot process: firmware, bootloader, kernel, init; Linux vs Windows vs macOS^uname -a; dmesg; systemd-analyze",
"Filesystems and storage^Files, directories, paths; Absolute vs relative paths; Filesystem hierarchy; Partitions and filesystems; Mount points; File metadata and permissions; Disk capacity vs memory^ls -l; stat; mount; lsblk -f",
"Processes and memory^Program vs process; PIDs and parent processes; Foreground vs background; CPU scheduling; RAM, virtual memory, swap; Process states; Signals and termination^ps aux; top; kill -15; free -m",
"How applications work^Source code vs executable; Compiler vs interpreter; Libraries and dependencies; Environment variables; Program input and output; Exit codes; Logs and errors^env; export; echo $?; ldd",
"Virtualization and containers^Physical servers; Hypervisors Type 1 vs 2; VMs and guest OS; CPU, RAM, disk allocation; Snapshots, virtual networks; Containers vs VMs; Why DevOps uses containers^virsh list; docker ps",
"Client-server and revision^Client vs server; Request-response model; Browsers and web servers; App servers and databases; Basic app architecture; Review CPU, RAM, storage, processes; Link to DevOps^curl -I; ss -tulpn",
"CLI essentials^Navigation: cd, ls, pwd; Copy, move, remove; find and locate; man pages; Pipes; Redirection and stderr; Lab: organize a directory using only the CLI^cp; mv; rm; find; man; cmd > f 2>&1; cmd1 | cmd2",
"Users, groups, permissions^useradd, usermod; Groups; chmod and chown; umask; sudo and sudoers; setuid, sticky bit; ACL basics; Lab: shared directory for two users^useradd; usermod -aG; chmod 755; chown; visudo; getfacl",
"Package management^apt and dpkg; yum, dnf, rpm; Repositories; Install from source; Updates and versions; Lab: install Nginx, inspect its files^apt update; apt install; dpkg -l; dnf install; rpm -qa",
"Processes, services, logs^ps, top, htop; kill and nice; systemd unit files; systemctl; journalctl, /var/log; Lab: systemd service for a Python script^systemctl status; systemctl enable; journalctl -u svc -f; htop",
"Text processing^grep; sed; awk; cut, sort, uniq; head, tail -f; Regex basics; Lab: analyze an Nginx access log^grep -rn; sed -i; awk '{print $1}'; sort | uniq -c; tail -f",
"Bash scripting^Variables; Conditionals; Loops; Functions; Arguments; set -euo pipefail, trap; Lab: backup and health-check scripts^set -euo pipefail; if/for/while; trap; $1 $@",
"Cron, SSH, disks^cron and systemd timers; SSH keys and config; scp, rsync; tmux; df, du, lsblk, fstab; Lab: schedule backup, harden sshd^crontab -e; ssh-keygen; ssh-copy-id; rsync -avz; tmux; /etc/fstab",
"Networking models^OSI vs TCP/IP; MAC, IP, ports; TCP vs UDP; Three-way handshake; Lab: capture a handshake^tcpdump -i eth0; ss -tan; nc -zv host 80",
"IP addressing and subnetting^IPv4; Private vs public; CIDR and masks; Gateways; NAT; Lab: subnet 10.0.0.0/16 into four^ip a; ip route; ipcalc 10.0.0.0/16",
"DNS^Record types: A, CNAME, MX, TXT, NS; Resolvers; TTL; dig and nslookup; Lab: point your domain to a server^dig A site; nslookup; host; resolvectl status",
"HTTP, HTTPS, TLS^Methods; Status codes; Headers, cookies; Certificates; Let's Encrypt; curl; Lab: HTTPS with certbot^curl -v; openssl s_client; certbot --nginx",
"Proxies, load balancers, firewalls^Forward vs reverse proxy; L4 vs L7; Nginx upstreams; iptables, ufw; Security groups idea; Lab: balance two instances, test failover^nginx -t; upstream {}; ufw allow 80; iptables -L",
"Network troubleshooting^ping, traceroute, mtr; ss, netstat; curl -v; nc; ip, route; Lab: fix three broken setups^ping; traceroute; mtr; ss -tulpn; curl -v",
"Git and GitHub^Branching strategies; Merge vs rebase; Cherry-pick, stash; Conflict resolution; Pull requests; Tags, semver; Protected branches; Lab: team workflow^git rebase; git cherry-pick; git stash; git tag; git log --graph",
"Docker: images and Dockerfile^Images and layers; Dockerfile instructions; Build cache; .dockerignore; Lab: containerize your own app^docker build -t; docker run -d -p; docker images; docker history",
"Docker: multi-stage and small images^Multi-stage builds; Slim and alpine images; Non-root user; Healthchecks; Size optimization; Lab: shrink image by 70%^FROM .. AS build; USER; HEALTHCHECK; docker image prune",
"Docker: storage and networking^Volumes vs bind mounts; Bridge, host networks; Port mapping; Container DNS; Lab: app plus PostgreSQL with persistence^docker volume create; docker network create; docker exec -it; docker logs",
"Docker Compose and registries^Multi-service stacks; Env files; depends_on; Docker Hub, GHCR; Tagging strategy; Lab: push a compose stack^docker compose up -d; docker compose logs; docker tag; docker push",
"CI with GitHub Actions^Workflows and triggers; Jobs, steps, runners; Secrets; Caching; Lab: lint and test pipeline^.github/workflows/ci.yml; on: push; jobs; actions/cache",
"CD with GitHub Actions^Build and push image; Deploy via SSH; Environments, approvals; Matrix builds; Lab: commit to running container^build-push-action; ssh-action; environments; matrix",
"Jenkins basics^Architecture; Declarative Jenkinsfile; Agents; Plugins, credentials; Lab: recreate your pipeline^Jenkinsfile; pipeline { stages {} }; agent; credentials",
"AWS basics and IAM^Regions, AZs; Shared responsibility; Users, roles, policies; Least privilege; MFA; Billing alarm; Lab: account and admin user^aws configure; aws sts get-caller-identity; aws iam list-users",
"EC2^Instance types; AMIs; Key pairs; Security groups; EBS, Elastic IP; User data; Lab: deploy Docker app by hand^aws ec2 run-instances; aws ec2 describe-instances; ssh -i key.pem",
"VPC^VPC and subnets; Public vs private; Route tables; IGW, NAT gateway; NACLs; Lab: custom VPC^aws ec2 create-vpc; create-subnet; route tables; IGW; NAT",
"S3, RDS, CloudFront^Buckets and policies; Versioning, lifecycle; Static hosting; RDS Multi-AZ, backups; CloudFront; Lab: site on S3, DB on RDS^aws s3 cp; aws s3 sync; aws rds describe-db-instances",
"Load balancing and scaling^ALB, target groups; Health checks; ASG, launch templates; Route 53; Lab: ALB in front of ASG^aws elbv2 create-load-balancer; launch template; aws autoscaling",
"Monitoring and serverless^CloudWatch metrics, logs; Alarms, SNS; Lambda basics; ECR; ECS overview; Lab: CPU alarm, S3-triggered Lambda^aws logs tail; put-metric-alarm; aws lambda invoke; ecr get-login-password",
"AWS capstone and checkpoint^Deploy capstone by hand; Practice exam; Resume update; Start applying to jobs^manual deploy; practice exam; update resume",
"Terraform fundamentals^Providers, resources; init, plan, apply, destroy; Variables, outputs; State; Lab: EC2 via Terraform^terraform init; plan; apply; destroy; fmt; validate",
"Terraform intermediate^Data sources; Locals; count, for_each; Dependencies; Lifecycle; Why avoid provisioners; Lab: SGs and loops^variable; output; data; for_each; count",
"Terraform modules and remote state^Reusable modules; S3 backend, DynamoDB lock; Workspaces; tfvars per environment; Lab: VPC module^module {}; backend \"s3\"; terraform workspace; terraform state list",
"Full stack in Terraform^VPC and subnets; ALB and ASG; RDS; Apply, then destroy; Lab: rebuild Day 35 architecture^terraform graph; terraform import; terraform state mv; plan -out",
"Ansible 1^Inventory; Ad-hoc commands; Playbooks; Modules; Variables, handlers; Idempotency; Lab: install Docker and Nginx^ansible all -m ping; ansible-playbook -i inv play.yml --check",
"Ansible 2^Roles; Jinja2 templates; Vault; Tags; Dynamic inventory; Lab: app server role^ansible-galaxy init; ansible-vault encrypt; .j2; --tags",
"IaC pipeline^terraform fmt, validate, plan in CI; tfsec and Checkov scans; Weekly revision^tfsec .; checkov -d .; terraform plan in Actions",
"Kubernetes architecture and setup^API server, etcd; Scheduler, controllers; kubelet, kube-proxy; kubectl; minikube or kind; Lab: local cluster^minikube start; kind create cluster; kubectl get nodes",
"Pods and workloads^Pods; ReplicaSets; Deployments; Rolling updates; Rollbacks; Labels, selectors; Lab: bad rollout and rollback^kubectl apply -f; kubectl scale; rollout status; rollout undo",
"Services and networking^ClusterIP; NodePort; LoadBalancer; Cluster DNS; Ingress controllers; Lab: expose app via Ingress^kubectl expose; get svc,ing; port-forward; ingress-nginx",
"Configuration and secrets^ConfigMaps; Secrets; Environment variables; Mounted files; Lab: externalize config^kubectl create configmap; kubectl create secret; describe; envFrom",
"Storage and stateful apps^Volumes; PV and PVC; StorageClass; StatefulSets; Lab: PostgreSQL with persistent storage^kubectl get pv,pvc; StatefulSet; StorageClass",
"Health, resources, scaling^Liveness, readiness, startup probes; Requests and limits; HPA; Namespaces; ResourceQuota; Lab: autoscale under load^kubectl top; kubectl autoscale; livenessProbe; resources.limits",
"Helm^Charts; Values; Templates; Releases; Repositories; Lab: package your app as a chart^helm repo add; helm install; helm upgrade; helm rollback; helm create; helm template",
"Security and scheduling^RBAC; ServiceAccounts; NetworkPolicy; Taints and tolerations; Node affinity; Pod security; Lab: read-only user^kubectl auth can-i; Role; RoleBinding; taint; affinity",
"Kubernetes on cloud, troubleshooting^EKS overview; describe, logs, events; CrashLoopBackOff; ImagePullBackOff; Pending pods; Lab: debug five broken manifests^eksctl create cluster; kubectl logs; kubectl describe; get events --sort-by",
"GitOps^Argo CD or Flux; Declarative deploys; Sync and drift; Lab: Argo CD deploys your Helm chart^argocd app create; argocd app sync; kubectl -n argocd get pods",
"Prometheus and Grafana^Exporters; PromQL basics; Dashboards; Alert rules; Alertmanager; Lab: app and node dashboards^promtool check rules; rate(); up; Grafana dashboards",
"Logging and tracing^Centralized logging; Loki or ELK; Structured logs; OpenTelemetry concepts; Lab: ship logs to Loki^Loki; Promtail; logcli; LogQL {app=\"x\"}",
"DevSecOps^Secrets management; Image scanning with Trivy; Dependency scanning; SAST, SBOM; Least privilege; Lab: scans in pipeline^trivy image; gitleaks detect; aws secretsmanager get-secret-value",
"SRE concepts^SLI, SLO, SLA; Error budgets; Incident response; Postmortems; Backup and DR; Blue-green, canary; Lab: mock postmortem^SLI; SLO; error budget; postmortem; canary; blue-green",
"Python for DevOps^boto3; subprocess; requests; CLI tools; Slack alerts; Lab: idle EC2 reporter^boto3.client('ec2'); subprocess.run; requests; argparse",
"Finish the capstone^Clean README; Architecture diagram; Screenshots and demo video; Cost note^README; architecture diagram; demo video",
"Resume and profile^New headline; Skills section; DevOps-focused bullets; LinkedIn; GitHub pins^DevOps headline; skills section; pinned repos",
"Mock interviews^Answer questions aloud; Record yourself; Fix weak topics; Apply daily^10 questions aloud; apply daily; network"
].map(function(s){var x=s.split("^");return{t:x[0],s:x[1].split("; "),c:x[2].split("; ")}});
var KEY="devops60v2",S={c:{},start:""},TOT=0;
D.forEach(function(d){TOT+=d.s.length});
function seed(){for(var d=1;d<=7;d++)D[d-1].s.forEach(function(_,i){S.c[d+":"+i]=1})}
function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);else seed()}catch(e){seed()}if(!S.c)S.c={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function dayCount(d){var n=0;D[d-1].s.forEach(function(_,i){if(S.c[d+":"+i])n++});return n}
function build(){
 var h="";
 PH.forEach(function(p,pi){
  h+='<details class="ph"><summary><span class="ttl">'+p[0]+' (Days '+p[1]+'-'+p[2]+')</span><span class="cnt" id="pc'+pi+'"></span><span class="mini"><i id="pm'+pi+'"></i></span></summary><div class="in">';
  for(var d=p[1];d<=p[2];d++){var x=D[d-1];
   h+='<details class="day" id="day'+d+'"><summary><span class="dn">Day '+d+'</span><span class="ttl">'+esc(x.t)+'</span><span class="cnt" id="dc'+d+'"></span></summary><div class="body"><h4>Subtopics</h4><ul>';
   x.s.forEach(function(s,i){h+='<li><label><input type="checkbox" data-k="'+d+':'+i+'"><span>'+esc(s)+'</span></label></li>'});
   h+='</ul><h4>Key commands and files</h4><div>'+x.c.map(function(c){return"<code>"+esc(c)+"</code>"}).join("")+'</div><button class="mk" data-d="'+d+'">Mark whole day done</button></div></details>'}
  h+='</div></details>'});
 document.getElementById("tree").innerHTML=h;
 var cb=document.querySelectorAll("input[data-k]");for(var i=0;i<cb.length;i++)cb[i].checked=!!S.c[cb[i].getAttribute("data-k")]}
function stats(){
 var t=0,full=0,nx=null,run=0,broke=false;
 for(var d=1;d<=60;d++){var n=dayCount(d),tot=D[d-1].s.length;t+=n;
  var f=n===tot;if(f){full++;if(!broke)run++}else{broke=true;if(nx===null)nx=d}
  document.getElementById("dc"+d).textContent=n+"/"+tot;
  document.getElementById("day"+d).className="day"+(f?" full":"")}
 PH.forEach(function(p,pi){var a=0,b=0;for(var d=p[1];d<=p[2];d++){a+=dayCount(d);b+=D[d-1].s.length}
  document.getElementById("pc"+pi).textContent=a+"/"+b+" topics";document.getElementById("pm"+pi).style.width=(a/b*100)+"%"});
 var pc=Math.round(t/TOT*100);
 document.getElementById("pct").textContent=pc+"%";
 document.getElementById("cnt").textContent=t+" of "+TOT+" subtopics done";
 document.getElementById("fill").style.width=pc+"%";
 document.getElementById("pb").setAttribute("aria-valuenow",pc);
 document.getElementById("dd").textContent=full+" of 60";
 document.getElementById("streak").textContent=run+" day"+(run==1?"":"s");
 document.getElementById("next").textContent=nx?"Day "+nx:"All done";
 var pe=document.getElementById("pace");pe.textContent="";pe.style.color="";
 if(S.start){var td=Math.floor((new Date()-new Date(S.start+"T00:00:00"))/864e5)+1;
  if(td<1)pe.textContent="Starts in "+(1-td)+" day(s).";
  else{var tg=Math.min(td,60),df=full-tg;
   pe.textContent="Target today: Day "+tg+". "+(df>0?"You are "+df+" day(s) ahead.":df<0?"You are "+(-df)+" day(s) behind.":"You are on track.");
   pe.style.color=df<0?"var(--warn)":"var(--acc)"}}}
var tree=document.getElementById("tree");
tree.addEventListener("change",function(e){var k=e.target.getAttribute("data-k");if(!k)return;
 if(e.target.checked)S.c[k]=1;else delete S.c[k];save();stats()});
tree.addEventListener("click",function(e){var d=e.target.getAttribute&&e.target.getAttribute("data-d");if(!d)return;
 D[d-1].s.forEach(function(_,i){S.c[d+":"+i]=1});save();build();stats();document.getElementById("day"+d).open=true;
 var ph=document.getElementById("day"+d).closest(".ph");ph.open=true});
function setAll(o){var a=document.querySelectorAll("details");for(var i=0;i<a.length;i++)a[i].open=o}
document.getElementById("exp").onclick=function(){setAll(true)};
document.getElementById("col").onclick=function(){setAll(false)};
document.getElementById("reset").onclick=function(){if(confirm("Clear all progress?")){S.c={};save();build();stats()}};
document.getElementById("start").onchange=function(){S.start=this.value;save();stats()};
load();document.getElementById("start").value=S.start||"";build();stats();
</script>
</body>
</html>
